<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual — Round 3 | Exercícios</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <link rel="stylesheet" href="https://use.typekit.net/sbt4grx.css">
    <style>
        @font-face {
            font-family: "5by7";
            src: url("5by7_b.woff") format("woff");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
            background: #FFFFE0;
            transition: background 0.35s ease;
        }

        body {
            font-family: "neue-haas-grotesk-display", "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #581E30;
            position: relative;
            padding-bottom: 90px;
            transition: background 0.35s ease, color 0.35s ease;
        }

        body[data-mode="avancado"] {
            background: #581E30;
            color: #FFFFE0;
        }

        .bg-photo {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: url("57.jpg") center top / cover no-repeat fixed;
            opacity: 0.16;
            mix-blend-mode: exclusion;
            pointer-events: none;
        }

        .bg-grain {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.15;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        }

        .page-nav {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: flex-start;
            padding: 3vh 5vw 3vh;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4vh;
            grid-column: 2;
            justify-self: center;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .brand:hover {
            opacity: 0.8;
        }

        .brand .logo {
            width: clamp(90px, 7.2vw, 150px);
            height: auto;
            display: block;
        }

        .round-label {
            width: clamp(46px, 4vw, 80px);
            height: auto;
            display: block;
        }

        .menu-icons {
            display: flex;
            flex-direction: column;
            gap: 0.9vh;
            grid-column: 3;
            justify-self: end;
        }

        .menu-dots {
            width: clamp(24px, 2.2vw, 40px);
            height: auto;
            display: block;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .menu-dots:hover {
            opacity: 0.6;
        }

        .menu-dots.is-hidden {
            opacity: 0;
            pointer-events: none;
        }

        body[data-mode="avancado"] .logo-dark,
        body[data-mode="avancado"] .round-dark,
        body[data-mode="avancado"] .menu-dots-dark {
            display: none;
        }

        body:not([data-mode="avancado"]) .logo-light,
        body:not([data-mode="avancado"]) .round-light,
        body:not([data-mode="avancado"]) .menu-dots-light {
            display: none;
        }

        .page {
            position: relative;
            z-index: 1;
            max-width: 560px;
            margin: 0 auto;
            padding: 0 6vw;
        }

        .mode-toggle {
            display: flex;
            width: fit-content;
            margin: 0.3vh auto 0.7vh;
            border: 1.5px solid currentColor;
            border-radius: 999px;
            padding: 4px;
            gap: 4px;
        }

        .mode-btn {
            appearance: none;
            border: none;
            background: none;
            font-family: "5by7", "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-style: normal;
            font-size: 12px;
            font-weight: 700;
            line-height: normal;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            color: inherit;
            padding: 7px 18px;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .mode-btn.active {
            background: #581E30;
            color: #FFFFE0;
        }

        body[data-mode="avancado"] .mode-btn.active {
            background: #FFFFE0;
            color: #581E30;
        }

        .stations {
            display: flex;
            flex-direction: column;
            gap: 0.15vh;
        }

        .station-name {
            font-family: "neue-haas-grotesk-display", "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-align: center;
            font-size: clamp(13px, 2.8vw, 16px);
            font-weight: 500;
            letter-spacing: -0.01em;
            margin-bottom: 6px;
        }

        .station-row {
            position: relative;
        }

        .station-num {
            position: absolute;
            right: calc(50% + min(70%, 260px) / 2 + 22px);
            top: 50%;
            transform: translateY(-50%);
            font-family: "5by7", "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-style: normal;
            font-weight: 700;
            font-size: clamp(28px, 7vw, 42px);
            line-height: 1;
            color: #A85C2E;
            transition: color 0.35s ease;
        }

        body[data-mode="avancado"] .station-num {
            color: #F5A139;
        }

        .station-cards {
            width: 70%;
            max-width: 260px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 26px;
        }

        .s-card {
            background: #581E30;
            border-radius: 9px;
            padding: 5px 8px 6px;
            height: 50px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 1px;
            transition: background 0.35s ease;
        }

        body[data-mode="avancado"] .s-card {
            background: #FFFFE0;
        }

        .s-label {
            font-family: "neue-haas-grotesk-display", "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 8px;
            font-weight: 400;
            color: #F0B27A;
            margin-bottom: 1px;
            white-space: nowrap;
        }

        body[data-mode="avancado"] .s-label {
            color: #A85C2E;
        }

        .s-value {
            font-family: "neue-haas-grotesk-display", "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 12px;
            font-weight: 400;
            color: #FFFFE0;
        }

        .s-extra {
            font-family: "neue-haas-grotesk-display", "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: 11px;
            font-weight: 400;
            color: #FFFFE0;
        }

        body[data-mode="avancado"] .s-value,
        body[data-mode="avancado"] .s-extra {
            color: #581E30;
        }

        .menu-popup {
            position: fixed;
            top: 2.8vh;
            right: 2.5vw;
            width: 240px;
            max-width: 82vw;
            min-height: 170px;
            background: #581E30;
            border: 1px solid rgba(255, 255, 224, 0.15);
            border-radius: 30px;
            padding: 26px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: clamp(14px, 2.4vh, 24px);
            z-index: 20;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.96);
            transform-origin: top right;
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
        }

        .menu-popup.open {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        .popup-close {
            position: absolute;
            top: 22px;
            right: 26px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .popup-close svg {
            width: 100%;
            height: 100%;
            display: block;
            transition: transform 0.2s ease;
        }

        .popup-close:hover svg {
            transform: rotate(90deg);
        }

        .popup-link {
            color: #FFFFE0;
            -webkit-text-stroke-width: 1.1px;
            -webkit-text-stroke-color: #FFFFE0;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: clamp(17px, 2vw, 22px);
            font-style: normal;
            font-weight: 200;
            line-height: normal;
            letter-spacing: 1.3px;
            text-decoration: none;
            width: fit-content;
            transition: opacity 0.2s ease;
        }

        .popup-link:hover {
            opacity: 0.75;
        }

        .mobile-menu-trigger {
            display: none;
            position: fixed;
            bottom: 4vh;
            left: 50%;
            transform: translateX(-50%);
            width: 176px;
            height: 51px;
            background: #581E30;
            border: none;
            border-radius: 999px;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            z-index: 15;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .mobile-menu-trigger.scroll-hidden {
            transform: translateX(-50%) translateY(150%);
            opacity: 0;
            pointer-events: none;
        }

        .mobile-menu-trigger svg {
            width: 22px;
            height: auto;
            display: block;
            flex-shrink: 0;
            transition: transform 0.25s ease;
        }

        .mobile-menu-trigger.open svg {
            transform: rotate(180deg);
        }

        .mobile-menu-trigger .menu-word {
            height: 18px;
            width: auto;
            display: block;
        }

        @media (max-width: 768px) {
            .menu-icons {
                display: none;
            }

            .mobile-menu-trigger {
                display: flex;
            }

            .menu-popup {
                top: auto;
                bottom: 4vh;
                left: 50%;
                right: auto;
                width: 176px;
                max-width: 176px;
                min-height: 0;
                background: #FFFFE0;
                border: 0.3px solid rgba(88, 30, 48, 0.25);
                box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
                border-radius: 26px;
                padding: 30px 20px 70px;
                align-items: center;
                opacity: 1;
                visibility: visible;
                transform: translateX(-50%);
                clip-path: inset(100% 0 0 0);
                pointer-events: none;
                transition: clip-path 0.35s ease;
                z-index: 14;
            }

            .menu-popup.open {
                transform: translateX(-50%);
                clip-path: inset(0 0 0 0);
                pointer-events: auto;
            }

            .popup-close {
                display: none;
            }

            .popup-link {
                color: #581E30;
                -webkit-text-stroke-color: #581E30;
                font-size: 18px;
                letter-spacing: 1px;
                white-space: nowrap;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body data-mode="regular">
    <div class="bg-photo"></div>
    <div class="bg-grain"></div>

    <header class="page-nav">
        <a class="brand" href="index.html">
            <img class="logo logo-dark" src="Logo%20dual%20dark.svg" alt="Dual">
            <img class="logo logo-light" src="Logo%20dual.svg" alt="Dual">
            <img class="round-label round-dark" src="Round%203%20dark.svg" alt="round 3">
            <img class="round-label round-light" src="Round%203.svg" alt="round 3">
        </a>
        <div class="menu-icons">
            <img class="menu-dots menu-dots-dark" id="menuToggleDark" src="Menu%20desktop%20dark.svg" alt="Menu" onclick="toggleMenu(event)">
            <img class="menu-dots menu-dots-light" id="menuToggleLight" src="Menu%20desktop.svg" alt="Menu" onclick="toggleMenu(event)">
        </div>
    </header>

    <main class="page">
        <div class="mode-toggle" id="modeToggle" role="group" aria-label="Nível">
            <button type="button" class="mode-btn active" data-mode="regular">Regular</button>
            <button type="button" class="mode-btn" data-mode="avancado">Avançado</button>
        </div>

        <div class="stations" id="stations"></div>
    </main>

        </span>
        <a class="popup-link" href="exercicios.html">Exercícios</a>
        <a class="popup-link" href="inscricao.html">Inscrição</a>

    <button class="mobile-menu-trigger" id="mobileMenuToggle" type="button" onclick="toggleMenu(event)">

        </svg>
        <img class="menu-word" src="Menu%20texto.svg" alt="Menu">
    </button>

    <script>
        var stationsData = {
            regular: [
                { name: 'Box Jump', m: { value: '100 reps', extra: 'Box de 50 cm' }, f: { value: '80 reps', extra: 'Box de 50 cm' } },
                { name: 'Single Arm Snatch', m: { value: '100 reps', extra: '12,5 kg' }, f: { value: '100 reps', extra: '7,5 kg' } },
                { name: 'Walking Lunge', m: { value: '100m', extra: '10 kg' }, f: { value: '100m', extra: '5 kg' } },
                { name: 'Flexões', m: { value: '100 reps' }, f: { value: '60 reps' } },
                { name: 'Farmer Carry', m: { value: '200m', extra: '16 kg' }, f: { value: '200m', extra: '12 kg' } },
                { name: 'Bear Crawl', m: { value: '40m' }, f: { value: '40m' } },
                { name: 'Burpee Broad', m: { value: '40m' }, f: { value: '40m' } },
                { name: 'Partner Wallball', m: { value: '100 reps', extra: '6 kg' }, f: { value: '100 reps', extra: '4 kg' } }
            ],
            avancado: [
                { name: 'Box Jump', m: { value: '100 reps', extra: 'Box de 60 cm' }, f: { value: '80 reps', extra: 'Box de 60 cm' } },
                { name: 'Single Arm Snatch', m: { value: '100 reps', extra: '17,5 kg' }, f: { value: '100 reps', extra: '12,5 kg' } },
                { name: 'Walking Lunge', m: { value: '100m', extra: '20 kg' }, f: { value: '100m', extra: '10 kg' } },
                { name: 'Flexões', m: { value: '120 reps' }, f: { value: '80 reps' } },
                { name: 'Farmer Carry', m: { value: '200m', extra: '24 kg' }, f: { value: '200m', extra: '16 kg' } },
                { name: 'Bear Crawl / Crab Walk', m: { value: '80m' }, f: { value: '80m' } },
                { name: 'Burpee Broad', m: { value: '80m' }, f: { value: '80m' } },
                { name: 'Partner Wallball', m: { value: '100 reps', extra: '8 kg' }, f: { value: '100 reps', extra: '6 kg' } }
            ]
        };

        var currentLevel = 'regular';
        var stationsEl = document.getElementById('stations');

        function renderStations() {
            var list = stationsData[currentLevel];
            stationsEl.innerHTML = list.map(function (s, i) {
                var num = String(i + 1).padStart(2, '0');
                var mExtra = s.m.extra ? '<span class="s-extra">' + s.m.extra + '</span>' : '';
                var fExtra = s.f.extra ? '<span class="s-extra">' + s.f.extra + '</span>' : '';
                return (
                    '<div class="station">' +
                        '<h2 class="station-name">' + s.name + '</h2>' +
                        '<div class="station-row">' +
                            '<span class="station-num">' + num + '</span>' +
                            '<div class="station-cards">' +
                                '<div class="s-card"><span class="s-label">Masculino / Misto</span><span class="s-value">' + s.m.value + '</span>' + mExtra + '</div>' +
                                '<div class="s-card"><span class="s-label">Feminino</span><span class="s-value">' + s.f.value + '</span>' + fExtra + '</div>' +
                            '</div>' +
                        '</div>' +
                    '</div>'
                );
            }).join('');
        }

        var modeToggle = document.getElementById('modeToggle');
        var modeButtons = modeToggle.querySelectorAll('.mode-btn');

        modeToggle.addEventListener('click', function (event) {
            var btn = event.target.closest('.mode-btn');
            if (!btn) return;

            modeButtons.forEach(function (b) {
                b.classList.remove('active');
            });
            btn.classList.add('active');

            currentLevel = btn.dataset.mode;
            document.body.setAttribute('data-mode', currentLevel);
            document.documentElement.style.background = currentLevel === 'avancado' ? '#581E30' : '#FFFFE0';
            renderStations();
        });

        renderStations();

        function toggleMenu(event) {
            event.stopPropagation();
            var popup = document.getElementById('menuPopup');
            var toggles = document.querySelectorAll('.menu-dots');
            var mobileToggle = document.getElementById('mobileMenuToggle');
            var isOpen = popup.classList.toggle('open');
            toggles.forEach(function (toggle) {
                toggle.classList.toggle('is-hidden', isOpen);
            });
            if (mobileToggle) {
                mobileToggle.classList.toggle('open', isOpen);
            }
        }

        function closeMenu() {
            document.getElementById('menuPopup').classList.remove('open');
            document.querySelectorAll('.menu-dots').forEach(function (toggle) {
                toggle.classList.remove('is-hidden');
            });
            var mobileToggle = document.getElementById('mobileMenuToggle');
            if (mobileToggle) {
                mobileToggle.classList.remove('open');
            }
        }

        document.addEventListener('click', function (event) {
            var popup = document.getElementById('menuPopup');
            var toggle = document.getElementById('mobileMenuToggle');
            if (popup.classList.contains('open') && !popup.contains(event.target) && event.target !== toggle && !toggle.contains(event.target)) {
                closeMenu();
            }
        });

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                closeMenu();
            }
        });

        (function () {
            var trigger = document.getElementById('mobileMenuToggle');
            var popup = document.getElementById('menuPopup');
            var lastScrollY = window.scrollY;
            var scrollThreshold = 10;

            window.addEventListener('scroll', function () {
                if (!trigger) return;
                if (popup && popup.classList.contains('open')) return;

                var currentScrollY = window.scrollY;
                if (Math.abs(currentScrollY - lastScrollY) < scrollThreshold) return;

                if (currentScrollY > lastScrollY && currentScrollY > 80) {
                    trigger.classList.add('scroll-hidden');
                } else {
                    trigger.classList.remove('scroll-hidden');
                }
                lastScrollY = currentScrollY;
            }, { passive: true });
        })();
    </script>
</body>
</html>
