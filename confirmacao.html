<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual — Confirmação</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
            background: #FFFFF5;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            padding-bottom: 140px;
        }

        .page-nav {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: flex-start;
            padding: 4vh 5vw 2vh;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4vh;
            grid-column: 2;
            justify-self: center;
            text-decoration: none;
        }

        .brand .logo {
            width: clamp(90px, 7.2vw, 150px);
            height: auto;
            display: block;
        }

        .round-label {
            width: clamp(64px, 5.2vw, 108px);
            height: auto;
            display: block;
        }

        .menu-icons {
            display: flex;
            flex-direction: column;
            gap: 0.9vh;
            grid-column: 3;
            justify-self: end;
        }

        .menu-dots {
            width: clamp(24px, 2.2vw, 40px);
            height: auto;
            display: block;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .menu-dots:hover {
            opacity: 0.6;
        }

        .menu-dots.is-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .form-wrap {
            max-width: 480px;
            margin: 0 auto;
            padding: 3vh 24px 0;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: rgba(88, 30, 48, 0.45);
            text-decoration: none;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .back-link svg {
            display: block;
            transform: rotate(180deg);
        }

        h1 {
            color: #581E30;
            font-size: clamp(28px, 6vw, 36px);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 24px;
        }

        .form-wrap p {
            color: #581E30;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .menu-popup {
            position: fixed;
            top: 2.8vh;
            right: 2.5vw;
            width: 240px;
            max-width: 82vw;
            min-height: 170px;
            background: #581E30;
            border-radius: 30px;
            padding: 26px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: clamp(14px, 2.4vh, 24px);
            z-index: 20;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.96);
            transform-origin: top right;
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
        }

        .menu-popup.open {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        .popup-close {
            position: absolute;
            top: 22px;
            right: 26px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .popup-close svg {
            width: 100%;
            height: 100%;
            display: block;
            transition: transform 0.2s ease;
        }

        .popup-close:hover svg {
            transform: rotate(90deg);
        }

        .popup-link {
            color: #FFFFE0;
            -webkit-text-stroke-width: 1.1px;
            -webkit-text-stroke-color: #FFFFE0;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: clamp(17px, 2vw, 22px);
            font-style: normal;
            font-weight: 200;
            line-height: normal;
            letter-spacing: 1.3px;
            text-decoration: none;
            width: fit-content;
            transition: opacity 0.2s ease;
        }

        .popup-link:hover {
            opacity: 0.75;
        }

        .mobile-menu-trigger {
            display: none;
            position: fixed;
            bottom: 4vh;
            left: 50%;
            transform: translateX(-50%);
            width: 176px;
            height: 51px;
            background: #581E30;
            border: none;
            border-radius: 999px;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            z-index: 15;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .mobile-menu-trigger.scroll-hidden {
            transform: translateX(-50%) translateY(150%);
            opacity: 0;
            pointer-events: none;
        }

        .mobile-menu-trigger svg {
            width: 22px;
            height: auto;
            display: block;
            flex-shrink: 0;
            transition: transform 0.25s ease;
        }

        .mobile-menu-trigger.open svg {
            transform: rotate(180deg);
        }

        .mobile-menu-trigger .menu-word {
            height: 18px;
            width: auto;
            display: block;
        }

        @media (max-width: 768px) {
            .menu-icons {
                display: none;
            }

            .mobile-menu-trigger {
                display: flex;
            }

            .menu-popup {
                top: auto;
                bottom: 4vh;
                left: 50%;
                right: auto;
                width: 176px;
                max-width: 176px;
                min-height: 0;
                background: #FFFFF5;
                border: 0.3px solid rgba(88, 30, 48, 0.25);
                box-shadow: 0 12px 30px rgba(81, 34, 48, 0.18);
                border-radius: 26px;
                padding: 30px 20px 70px;
                align-items: center;
                opacity: 1;
                visibility: visible;
                transform: translateX(-50%);
                clip-path: inset(100% 0 0 0);
                pointer-events: none;
                transition: clip-path 0.35s ease;
                z-index: 14;
            }

            .menu-popup.open {
                transform: translateX(-50%);
                clip-path: inset(0 0 0 0);
                pointer-events: auto;
            }

            .popup-close {
                display: none;
            }

            .popup-link {
                color: #581E30;
                -webkit-text-stroke-color: #581E30;
                font-size: 18px;
                letter-spacing: 1px;
                white-space: nowrap;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

    <script src="form-storage.js"></script>
    <script>
        // O envio para o Google Sheets já acontece em pagamento.html (é lá que
        // os ficheiros de comprovativo ainda estão em memória). Esta página
        // apenas confirma o passo final e limpa os dados da sessão.
        DualForm.clear();

        function toggleMenu(event) {
            event.stopPropagation();
            var popup = document.getElementById('menuPopup');
            var toggle = document.getElementById('menuToggle');
            var mobileToggle = document.getElementById('mobileMenuToggle');
            var isOpen = popup.classList.toggle('open');
            if (toggle) {
                toggle.classList.toggle('is-hidden', isOpen);
            }
            if (mobileToggle) {
                mobileToggle.classList.toggle('open', isOpen);
            }
        }

        function closeMenu() {
            document.getElementById('menuPopup').classList.remove('open');
            var toggle = document.getElementById('menuToggle');
            if (toggle) {
                toggle.classList.remove('is-hidden');
            }
            var mobileToggle = document.getElementById('mobileMenuToggle');
            if (mobileToggle) {
                mobileToggle.classList.remove('open');
            }
        }

        document.addEventListener('click', function (event) {
            var popup = document.getElementById('menuPopup');
            var toggle = document.getElementById('mobileMenuToggle');
            if (popup.classList.contains('open') && !popup.contains(event.target) && event.target !== toggle && !toggle.contains(event.target)) {
                closeMenu();
            }
        });

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                closeMenu();
            }
        });

        (function () {
            var trigger = document.getElementById('mobileMenuToggle');
            var popup = document.getElementById('menuPopup');
            var lastScrollY = window.scrollY;
            var scrollThreshold = 10;

            window.addEventListener('scroll', function () {
                if (!trigger) return;
                if (popup && popup.classList.contains('open')) return;

                var currentScrollY = window.scrollY;
                if (Math.abs(currentScrollY - lastScrollY) < scrollThreshold) return;

                if (currentScrollY > lastScrollY && currentScrollY > 80) {
                    trigger.classList.add('scroll-hidden');
                } else {
                    trigger.classList.remove('scroll-hidden');
                }
                lastScrollY = currentScrollY;
            }, { passive: true });
        })();
    </script>
