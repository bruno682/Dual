<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual — Round 3</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            background: #0a0a0a;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #0a0a0a;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: sepia(0.18) saturate(1.15) contrast(1.05) brightness(0.98);
        }

        .hero-slideshow {
            display: none;
            position: absolute;
            inset: 0;
        }

        .hero-slideshow .slide {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease;
            filter: sepia(0.18) saturate(1.15) contrast(1.05) brightness(0.98);
        }

        .hero-slideshow .slide.active {
            opacity: 1;
        }

        .hero-grain {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.18;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
        }

        .hero-vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.35) 100%);
        }

        .hero-nav {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 4vh 5vw 2vh;
            z-index: 5;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4vh;
        }

        .brand .logo {
            width: clamp(90px, 7.2vw, 150px);
            height: auto;
            display: block;
        }

        .round-label {
            width: clamp(64px, 5.2vw, 108px);
            height: auto;
            display: block;
        }

        .cta {
            position: absolute;
            top: 51%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(220px, 27vw, 560px);
            display: block;
            z-index: 5;
        }

        .cta img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 8px 18px rgba(0,0,0,0.35));
        }

        .construction-overlay {
            position: absolute;
            inset: 0;
            z-index: 30;
            pointer-events: none;
            background: rgba(88, 30, 48, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3.5vh;
            text-align: center;
            padding: 0 8vw;
        }

        .construction-overlay p {
            color: #FFFFE0;
            margin: 0;
        }

        .construction-overlay .construction-line1 {
            font-size: clamp(22px, 4vw, 32px);
            font-weight: 700;
        }

        .construction-overlay .construction-line2 {
            font-size: clamp(15px, 2.4vw, 20px);
            font-weight: 400;
            margin-top: 32.4vh;
        }

        .construction-progress {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px 12px;
            border: 1.5px solid #FFFFE0;
            border-radius: 999px;
        }

        .construction-progress .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #FFFFE0;
            flex-shrink: 0;
            animation: dotWave 1.6s ease-in-out infinite;
        }

        .construction-progress .dot:nth-child(1) { animation-delay: 0s; }
        .construction-progress .dot:nth-child(2) { animation-delay: 0.1s; }
        .construction-progress .dot:nth-child(3) { animation-delay: 0.2s; }
        .construction-progress .dot:nth-child(4) { animation-delay: 0.3s; }
        .construction-progress .dot:nth-child(5) { animation-delay: 0.4s; }
        .construction-progress .dot:nth-child(6) { animation-delay: 0.5s; }
        .construction-progress .dot:nth-child(7) { animation-delay: 0.6s; }
        .construction-progress .dot:nth-child(8) { animation-delay: 0.7s; }
        .construction-progress .dot:nth-child(9) { animation-delay: 0.8s; }
        .construction-progress .dot:nth-child(10) { animation-delay: 0.9s; }
        .construction-progress .dot:nth-child(11) { animation-delay: 1s; }
        .construction-progress .dot:nth-child(12) { animation-delay: 1.1s; }
        .construction-progress .dot:nth-child(13) { animation-delay: 1.2s; }

        @keyframes dotWave {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            12% {
                transform: scale(1.4);
                opacity: 1;
            }
            32% {
                transform: scale(0.85);
                opacity: 0.8;
            }
            52% {
                transform: scale(0.5);
                opacity: 0.5;
            }
            72% {
                transform: scale(0.2);
                opacity: 0.25;
            }
            88%, 100% {
                transform: scale(0);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .cta {
                width: clamp(200px, 60vw, 340px);
                top: 50%;
            }

            .hero-bg {
                display: none;
            }

            .hero-slideshow {
                display: block;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <video class="hero-bg" autoplay muted loop playsinline poster="Fundo1.jpg">
            <source src="DUAL%20SITE.mp4" type="video/mp4">
        </video>
        <div class="hero-slideshow" id="heroSlideshow">
            <img class="slide active" src="Fundo1.jpg" alt="">
            <img class="slide" src="Fundo2.jpg" alt="">
            <img class="slide" src="Fundo3.jpg" alt="">
        </div>
        <div class="hero-grain"></div>
        <div class="hero-vignette"></div>

        <header class="hero-nav">
            <div class="brand">
                <img class="logo" src="Logo%20dual.svg" alt="Dual">
                <img class="round-label" src="Round%203.svg" alt="round 3">
            </div>
        </header>

        <div class="cta">
            <img src="breve.svg" alt="">
        </div>

        <div class="construction-overlay">
            <p class="construction-line1">Ainda estamos a aquecer.</p>
            <p class="construction-line2">Mantém-te atento desse lado.</p>
            <div class="construction-progress">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
    </section>

    <script>
        (function () {
            var slides = document.querySelectorAll('#heroSlideshow .slide');
            var current = 0;
            if (slides.length > 1) {
                setInterval(function () {
                    slides[current].classList.remove('active');
                    current = (current + 1) % slides.length;
                    slides[current].classList.add('active');
                }, 5000);
            }
        })();
    </script>
</body>
</html>
