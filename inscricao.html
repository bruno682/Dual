<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dual — Inscrição</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
            background: #FFFFF5;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            padding-bottom: 140px;
        }

        .page-nav {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: flex-start;
            padding: 4vh 5vw 2vh;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4vh;
            grid-column: 2;
            justify-self: center;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .brand:hover {
            opacity: 0.8;
        }

        .brand .logo {
            width: clamp(90px, 7.2vw, 150px);
            height: auto;
            display: block;
        }

        .round-label {
            width: clamp(64px, 5.2vw, 108px);
            height: auto;
            display: block;
        }

        .menu-icons {
            display: flex;
            flex-direction: column;
            gap: 0.9vh;
            grid-column: 3;
            justify-self: end;
        }

        .menu-dots {
            width: clamp(24px, 2.2vw, 40px);
            height: auto;
            display: block;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .menu-dots:hover {
            opacity: 0.6;
        }

        .menu-dots.is-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .form-wrap {
            max-width: 480px;
            margin: 0 auto;
            padding: 3vh 24px 0;
        }

        .form-wrap h1 {
            color: #581E30;
            font-size: clamp(28px, 6vw, 40px);
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 20px;
        }

        .form-wrap .intro {
            color: #581E30;
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
            margin-bottom: 36px;
        }

        .field {
            margin-bottom: 30px;
        }

        .field label {
            display: block;
            color: #581E30;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .field input {
            width: 100%;
            height: 50px;
            padding: 0 16px;
            border-radius: 10px;
            border: 0.3px solid #581E30;
            background: rgba(81, 34, 48, 0.10);
            color: #581E30;
            font-family: inherit;
            font-size: 16px;
            outline: none;
        }

        .field input::placeholder {
            color: rgba(88, 30, 48, 0.5);
        }

        .required-mark {
            color: #B3261E;
            margin-left: 3px;
        }

        .field-error {
            display: block;
            min-height: 0;
            color: #B3261E;
            font-size: 13px;
            margin-top: 8px;
        }

        .field input.input-invalid {
            border-color: #B3261E;
            background: rgba(179, 38, 30, 0.08);
        }

        .pill-group {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 12px;
        }

        .pill-group.group-invalid .pill-option {
            border-color: #B3261E;
        }

        .pill-option {
            appearance: none;
            font-family: inherit;
            cursor: pointer;
            flex: 1;
            width: 0;
            padding: 14px 12px;
            border-radius: 10px;
            border: 0.3px solid #581E30;
            background: rgba(81, 34, 48, 0.10);
            color: #581E30;
            font-size: 16px;
            text-align: center;
            white-space: nowrap;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .pill-option.selected {
            background: #581E30;
            color: #FFFFE0;
        }

        .btn-avancar {
            appearance: none;
            font-family: inherit;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 24px;
            border-radius: 10px;
            border: none;
            background: #581E30;
            color: #FFFFE0;
            font-size: 16px;
            transition: opacity 0.2s ease;
        }

        .btn-avancar:hover {
            opacity: 0.85;
        }

        .btn-avancar svg {
            display: block;
        }

        .menu-popup {
            position: fixed;
            top: 2.8vh;
            right: 2.5vw;
            width: 240px;
            max-width: 82vw;
            min-height: 170px;
            background: #581E30;
            border-radius: 30px;
            padding: 26px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: clamp(14px, 2.4vh, 24px);
            z-index: 20;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.96);
            transform-origin: top right;
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
        }

        .menu-popup.open {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        .popup-close {
            position: absolute;
            top: 22px;
            right: 26px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .popup-close svg {
            width: 100%;
            height: 100%;
            display: block;
            transition: transform 0.2s ease;
        }

        .popup-close:hover svg {
            transform: rotate(90deg);
        }

        .popup-link {
            color: #FFFFE0;
            -webkit-text-stroke-width: 1.1px;
            -webkit-text-stroke-color: #FFFFE0;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-size: clamp(17px, 2vw, 22px);
            font-style: normal;
            font-weight: 200;
            line-height: normal;
            letter-spacing: 1.3px;
            text-decoration: none;
            width: fit-content;
            transition: opacity 0.2s ease;
        }

        .popup-link:hover {
            opacity: 0.75;
        }

        .mobile-menu-trigger {
            display: none;
            position: fixed;
            bottom: 4vh;
            left: 50%;
            transform: translateX(-50%);
            width: 176px;
            height: 51px;
            background: #581E30;
            border: none;
            border-radius: 999px;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            z-index: 15;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .mobile-menu-trigger.scroll-hidden {
            transform: translateX(-50%) translateY(150%);
            opacity: 0;
            pointer-events: none;
        }

        .mobile-menu-trigger svg {
            width: 22px;
            height: auto;
            display: block;
            flex-shrink: 0;
            transition: transform 0.25s ease;
        }

        .mobile-menu-trigger.open svg {
            transform: rotate(180deg);
        }

        .mobile-menu-trigger .menu-word {
            height: 18px;
            width: auto;
            display: block;
        }

        @media (max-width: 768px) {
            .menu-icons {
                display: none;
            }

            .mobile-menu-trigger {
                display: flex;
            }

            .menu-popup {
                top: auto;
                bottom: 4vh;
                left: 50%;
                right: auto;
                width: 176px;
                max-width: 176px;
                min-height: 0;
                background: #FFFFF5;
                border: 0.3px solid rgba(88, 30, 48, 0.25);
                box-shadow: 0 12px 30px rgba(81, 34, 48, 0.18);
                border-radius: 26px;
                padding: 30px 20px 70px;
                align-items: center;
                opacity: 1;
                visibility: visible;
                transform: translateX(-50%);
                clip-path: inset(100% 0 0 0);
                pointer-events: none;
                transition: clip-path 0.35s ease;
                z-index: 14;
            }

            .menu-popup.open {
                transform: translateX(-50%);
                clip-path: inset(0 0 0 0);
                pointer-events: auto;
            }

            .popup-close {
                display: none;
            }

            .popup-link {
                color: #581E30;
                -webkit-text-stroke-color: #581E30;
                font-size: 18px;
                letter-spacing: 1px;
                white-space: nowrap;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

    <script src="form-storage.js"></script>
    <script>
        function selectPill(button) {
            var group = button.closest('.pill-group');
            var options = group.querySelectorAll('.pill-option');
            options.forEach(function (opt) {
                opt.classList.remove('selected');
            });
            button.classList.add('selected');

            group.classList.remove('group-invalid');
            var errorId = group.getAttribute('data-error-id');
            if (errorId) {
                var errEl = document.getElementById(errorId);
                if (errEl) {
                    errEl.textContent = '';
                }
            }
        }

        function persistInscricao() {
            var nivelSelected = document.querySelector('.pill-group[data-group="nivel"] .selected');
            var categoriaSelected = document.querySelector('.pill-group[data-group="categoria"] .selected');
            DualForm.saveStep('inscricao', {
                nome_dupla: document.getElementById('nome-dupla').value.trim(),
                nivel: nivelSelected ? nivelSelected.textContent.trim() : '',
                categoria: categoriaSelected ? categoriaSelected.textContent.trim() : '',
                email: document.getElementById('email-contacto').value.trim(),
                telemovel: document.getElementById('tel-contacto').value.trim()
            });
        }

        document.querySelectorAll('.pill-option').forEach(function (button) {
            button.addEventListener('click', function () {
                selectPill(button);
                persistInscricao();
            });
        });

        (function restoreInscricao() {
            var saved = DualForm.getAll().inscricao;
            if (!saved) {
                return;
            }

            if (saved.nome_dupla) {
                document.getElementById('nome-dupla').value = saved.nome_dupla;
            }
            if (saved.email) {
                document.getElementById('email-contacto').value = saved.email;
            }
            if (saved.telemovel) {
                document.getElementById('tel-contacto').value = saved.telemovel;
            }

            [['nivel', saved.nivel], ['categoria', saved.categoria]].forEach(function (pair) {
                if (!pair[1]) {
                    return;
                }
                var btn = Array.prototype.find.call(
                    document.querySelectorAll('.pill-group[data-group="' + pair[0] + '"] .pill-option'),
                    function (b) { return b.textContent.trim() === pair[1]; }
                );
                if (btn) {
                    btn.classList.add('selected');
                }
            });
        })();

        function isValidEmail(value) {
            var trimmed = value.trim();
            var basicShape = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return basicShape.test(trimmed) && /\.com$/i.test(trimmed);
        }

        function isValidPortugalOrEuropePhone(value) {
            var cleaned = value.replace(/[\s().-]/g, '');
            var ptMobile = /^(\+351|00351)?9\d{8}$/;
            var ptLandline = /^(\+351|00351)?2\d{8}$/;
            var europeanGeneral = /^\+[1-9]\d{7,14}$/;
            return ptMobile.test(cleaned) || ptLandline.test(cleaned) || europeanGeneral.test(cleaned);
        }

        function setFieldError(fieldEl, errorEl, message) {
            if (message) {
                fieldEl.classList.add('input-invalid');
                errorEl.textContent = message;
            } else {
                fieldEl.classList.remove('input-invalid');
                errorEl.textContent = '';
            }
        }

        function setGroupError(groupEl, errorEl, message) {
            if (message) {
                groupEl.classList.add('group-invalid');
                errorEl.textContent = message;
            } else {
                groupEl.classList.remove('group-invalid');
                errorEl.textContent = '';
            }
        }

        ['nome-dupla', 'email-contacto', 'tel-contacto'].forEach(function (id) {
            var el = document.getElementById(id);
            var errEl = document.getElementById('error-' + id);
            el.addEventListener('input', function () {
                setFieldError(el, errEl, '');
                persistInscricao();
            });
        });

        document.getElementById('inscricao-form').addEventListener('submit', function (event) {
            event.preventDefault();
            var isValid = true;

            var nomeDupla = document.getElementById('nome-dupla');
            var errNomeDupla = document.getElementById('error-nome-dupla');
            if (!nomeDupla.value.trim()) {
                setFieldError(nomeDupla, errNomeDupla, 'Preenche o nome da dupla.');
                isValid = false;
            } else {
                setFieldError(nomeDupla, errNomeDupla, '');
            }

            var nivelGroup = document.querySelector('.pill-group[data-group="nivel"]');
            var errNivel = document.getElementById('error-nivel');
            if (!nivelGroup.querySelector('.selected')) {
                setGroupError(nivelGroup, errNivel, 'Escolhe o nível da dupla.');
                isValid = false;
            } else {
                setGroupError(nivelGroup, errNivel, '');
            }

            var categoriaGroup = document.querySelector('.pill-group[data-group="categoria"]');
            var errCategoria = document.getElementById('error-categoria');
            if (!categoriaGroup.querySelector('.selected')) {
                setGroupError(categoriaGroup, errCategoria, 'Escolhe a categoria da dupla.');
                isValid = false;
            } else {
                setGroupError(categoriaGroup, errCategoria, '');
            }

            var email = document.getElementById('email-contacto');
            var errEmail = document.getElementById('error-email-contacto');
            if (!email.value.trim()) {
                setFieldError(email, errEmail, 'Preenche o mail de contacto.');
                isValid = false;
            } else if (!isValidEmail(email.value)) {
                setFieldError(email, errEmail, 'Introduz um mail válido a terminar em ".com".');
                isValid = false;
            } else {
                setFieldError(email, errEmail, '');
            }

            var tel = document.getElementById('tel-contacto');
            var errTel = document.getElementById('error-tel-contacto');
            if (!tel.value.trim()) {
                setFieldError(tel, errTel, 'Preenche o telemóvel de contacto.');
                isValid = false;
            } else if (!isValidPortugalOrEuropePhone(tel.value)) {
                setFieldError(tel, errTel, 'Introduz um telemóvel válido (Portugal ou Europa).');
                isValid = false;
            } else {
                setFieldError(tel, errTel, '');
            }

            if (!isValid) {
                var firstInvalid = document.querySelector('.input-invalid, .group-invalid');
                if (firstInvalid) {
                    firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                return;
            }

            persistInscricao();

            window.location.href = 'atletas.html';
        });

        function toggleMenu(event) {
            event.stopPropagation();
            var popup = document.getElementById('menuPopup');
            var toggle = document.getElementById('menuToggle');
            var mobileToggle = document.getElementById('mobileMenuToggle');
            var isOpen = popup.classList.toggle('open');
            if (toggle) {
                toggle.classList.toggle('is-hidden', isOpen);
            }
            if (mobileToggle) {
                mobileToggle.classList.toggle('open', isOpen);
            }
        }

        function closeMenu() {
            document.getElementById('menuPopup').classList.remove('open');
            var toggle = document.getElementById('menuToggle');
            if (toggle) {
                toggle.classList.remove('is-hidden');
            }
            var mobileToggle = document.getElementById('mobileMenuToggle');
            if (mobileToggle) {
                mobileToggle.classList.remove('open');
            }
        }

        document.addEventListener('click', function (event) {
            var popup = document.getElementById('menuPopup');
            var toggle = document.getElementById('mobileMenuToggle');
            if (popup.classList.contains('open') && !popup.contains(event.target) && event.target !== toggle && !toggle.contains(event.target)) {
                closeMenu();
            }
        });

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                closeMenu();
            }
        });

        (function () {
            var trigger = document.getElementById('mobileMenuToggle');
            var popup = document.getElementById('menuPopup');
            var lastScrollY = window.scrollY;
            var scrollThreshold = 10;

            window.addEventListener('scroll', function () {
                if (!trigger) return;
                if (popup && popup.classList.contains('open')) return;

                var currentScrollY = window.scrollY;
                if (Math.abs(currentScrollY - lastScrollY) < scrollThreshold) return;

                if (currentScrollY > lastScrollY && currentScrollY > 80) {
                    trigger.classList.add('scroll-hidden');
                } else {
                    trigger.classList.remove('scroll-hidden');
                }
                lastScrollY = currentScrollY;
            }, { passive: true });
        })();
    </script>
</body>
</html>
